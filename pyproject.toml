[project]
name = "cat-flap"
version = "0.1.0"
description = "Autonomous cat flap with AI-based prey detection"
requires-python = ">=3.10"
dependencies = []

[tool.uv.sources]
hub-service = { workspace = true }
image-capturer-service = { workspace = true }
image-saver-service = { workspace = true }
inference-service = { workspace = true }
logger-service = { workspace = true }
logic-service = { workspace = true }
hardware-interface-service = { workspace = true }
lock-service = { workspace = true }
movement-detector-service = { workspace = true }
persistence-service = { workspace = true }
shared = { workspace = true }

[tool.uv.workspace]
members = ["./*-service", "./shared"]
exclude = ["train"]

[tool.uv]
dev-dependencies = [
  "hub-service",
  "image-capturer-service",
  "image-saver-service",
  "inference-service",
  "logger-service",
  "logic-service",
  "hardware-interface-service",
  "movement-detector-service",
  "persistence-service",
  "lock-service",
  "shared",
]
package = false

[tool.ruff.lint]
ignore = ["EXE002"]
