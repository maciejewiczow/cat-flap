name: Build and publish lock service image

on:
  push:
    branches:
      - master
    paths:
      - "*"
      - "shared/**"
      - "lock-service/**"
    paths-ignore:
      - README.md
      - .gitignore
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Build
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Build lock service
        uses: ./.github/actions/build-service
        with:
          service-name: lock
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
